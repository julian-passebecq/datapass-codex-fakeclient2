[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-blade3d"
version = "0.1.0"
description = "Synthetic educational wind pilot; not engineering validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["blade3d*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
